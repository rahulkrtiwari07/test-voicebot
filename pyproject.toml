[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent-platform"
version = "0.1.0"
description = "Config-driven outbound voice agent platform on LiveKit (portal, runtime, tools, post-call, dashboard)"
requires-python = ">=3.10, <3.15"

dependencies = [
    # Same voice stack as the NDR voicebot: Deepgram STT, Gemini LLM, Sarvam
    # TTS, Silero VAD, LiveKit Cloud + SIP trunk. openai is included so an
    # agent can be configured with llm_provider="openai" without a code change.
    # Pinned to the 1.7 line the NDR bot runs in production — the SDK APIs
    # used here (raw-schema tools, ChatMessage.metrics e2e_latency,
    # turn_handling options) were checked against it.
    "livekit-agents[deepgram,google,openai,sarvam,silero]~=1.7.0",
    "livekit-plugins-noise-cancellation>=0.3.0",
    "livekit-api>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
# Same constraint as the NDR voicebot: yarl 1.24.1 shipped only a cp310 wheel.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
include = ["vap*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
